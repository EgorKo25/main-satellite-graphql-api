name: main-satellite-graphql

services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: graphql
      POSTGRES_PASSWORD: graphql_dev
      POSTGRES_DB: graphql
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "graphql", "-d", "graphql"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: main-satellite-graphql-api:local
    build:
      context: .
      target: runtime
    working_dir: /migrations
    entrypoint:
      - /goose
      - -env=none
      - -dir
      - .
      - -timeout
      - 1m
      - postgres
      - postgres://graphql:graphql_dev@db:5432/graphql?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: main-satellite-graphql-api:local
    build:
      context: .
      target: runtime
    volumes:
      - type: bind
        source: ./config.compose.yaml
        target: /config.yaml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKERTEST_HOST: host.docker.internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
